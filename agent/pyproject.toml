[project]
name = "porch-light"
version = "0.1.0"
description = "Location-triggered porch light agent that drives the porch-agent MCP server"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    # Microsoft Agent Framework. The umbrella "agent-framework" package pulls in
    # ~30 integrations and pins mcp<2; only the core and the OpenAI-compatible
    # client are needed here.
    "agent-framework-core>=1.19,<2",
    "agent-framework-openai>=1.14,<2",
    # agent-framework's MCP client is written against the 1.x SDK (it imports
    # McpError and RequestResponder, which 2.x removed). That is why this project
    # has its own virtualenv: the server in the repo root needs mcp>=2. The two
    # talk over streamable-HTTP, where the version difference does not matter.
    "mcp>=1.24,<2",
    "paho-mqtt>=2,<3",
    "astral>=3,<4",
    "httpx>=0.27",
    "pyyaml>=6",
    # Already a dependency of agent-framework-core; declared because .env
    # loading uses it directly.
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
porch-light = "porch_light.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["porch_light"]

[tool.pytest.ini_options]
testpaths = ["tests"]
